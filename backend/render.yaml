services:
  - type: web
    name: csbuddy-api
    runtime: python
    plan: standard
    buildCommand: |
      pip install -r requirements.txt
      python scripts/build_embeddings.py
      python scripts/train_intent_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: https://csbuddy.vercel.app
      - key: ADMIN_TOKEN
        generateValue: true
